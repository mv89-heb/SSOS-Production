name: Repair test helpers

on:
  push:
    branches:
      - 'feature/price-intelligence-core'

permissions:
  contents: write
  actions: write

jobs:
  repair:
    if: github.actor == 'mv89-heb'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/price-intelligence-core
          fetch-depth: 0
      - name: Patch test helpers for four-eyes mapping approval
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('tests/test_import_execution.py')
          s = p.read_text()
          old = '''    client.post(f"/api/imports/{session_id}/analyze")\n    client.get(f"/api/imports/{session_id}/mapping")\n    approver_client = _approve_as_second_user(client)\n'''
          new = '''    client.post(f"/api/imports/{session_id}/analyze")\n    mapping = client.get(f"/api/imports/{session_id}/mapping").get_json()["mapping"]\n    for col in mapping["columns"]:\n        review = client.post(f"/api/imports/{session_id}/mapping", json={\n            "decisions": [{"column_index": col["column_index"], "target": col["final_target"]}]\n        })\n        assert review.status_code == 200, review.get_json()\n    approver_client = _approve_as_second_user(client)\n'''
          if old not in s:
              raise SystemExit('execution helper pattern not found')
          p.write_text(s.replace(old, new, 1))

          p = Path('tests/test_import_validation.py')
          s = p.read_text()
          old = '''def _full_pipeline(client, data, **kwargs):\n    """upload -> analyze -> get mapping -> approve -> returns session_id."""\n    session_id = _upload(client, data, **kwargs).get_json()["session"]["id"]\n    client.post(f"/api/imports/{session_id}/analyze")\n    client.get(f"/api/imports/{session_id}/mapping")\n    client.post(f"/api/imports/{session_id}/mapping/approve")\n    return session_id\n'''
          new = '''def _approve_as_second_user(client):\n    from app.extensions import db\n    from app.models.user import User, ROLE_MANAGER\n    tenant_id = client.get("/api/auth/me").get_json()["user"]["tenant_id"]\n    with client.application.app_context():\n        manager = User(tenant_id=tenant_id, email="validation-approver@acme.test", full_name="Validation Approver", role=ROLE_MANAGER, active=True)\n        manager.set_password("Passw0rd1")\n        db.session.add(manager)\n        db.session.commit()\n    approver = client.application.test_client()\n    login = approver.post("/api/auth/login", json={"email": "validation-approver@acme.test", "password": "Passw0rd1"})\n    assert login.status_code == 200, login.get_json()\n    return approver\n\n\ndef _full_pipeline(client, data, **kwargs):\n    """upload -> analyze -> review every column -> second-user approve."""\n    session_id = _upload(client, data, **kwargs).get_json()["session"]["id"]\n    client.post(f"/api/imports/{session_id}/analyze")\n    mapping = client.get(f"/api/imports/{session_id}/mapping").get_json()["mapping"]\n    for col in mapping["columns"]:\n        review = client.post(f"/api/imports/{session_id}/mapping", json={\n            "decisions": [{"column_index": col["column_index"], "target": col["final_target"]}]\n        })\n        assert review.status_code == 200, review.get_json()\n    approver = _approve_as_second_user(client)\n    approved = approver.post(f"/api/imports/{session_id}/mapping/approve")\n    assert approved.status_code == 200, approved.get_json()\n    return session_id\n'''
          if old not in s:
              raise SystemExit('validation helper pattern not found')
          p.write_text(s.replace(old, new, 1))

          p = Path('tests/test_import_mapping.py')
          s = p.read_text()
          old = '''        logged_in_client_a.post(f"/api/imports/{session_id}/mapping", json={\n            "decisions": [{"column_index": col["column_index"], "target": "IGNORE"}]\n        })\n        tenant_id = logged_in_client_a.get("/api/auth/me").get_json()["user"]["tenant_id"]\n'''
          new = '''        logged_in_client_a.post(f"/api/imports/{session_id}/mapping", json={\n            "decisions": [{"column_index": col["column_index"], "target": "IGNORE"}]\n        })\n        mapping_body = logged_in_client_a.get(f"/api/imports/{session_id}/mapping").get_json()["mapping"]\n        for remaining in mapping_body["columns"]:\n            if not remaining["user_reviewed"]:\n                review = logged_in_client_a.post(f"/api/imports/{session_id}/mapping", json={\n                    "decisions": [{"column_index": remaining["column_index"], "target": remaining["final_target"]}]\n                })\n                assert review.status_code == 200, review.get_json()\n        tenant_id = logged_in_client_a.get("/api/auth/me").get_json()["user"]["tenant_id"]\n'''
          if old not in s:
              raise SystemExit('mapping lifecycle pattern not found')
          p.write_text(s.replace(old, new, 1))

          p = Path('tests/test_import_mapping_security.py')
          s = p.read_text()
          old = '''    session_id, mapping = _mapping(logged_in_client_a)\n    approver = _second_user(logged_in_client_a)\n    approved = approver.post(f"/api/imports/{session_id}/mapping/approve")\n'''
          new = '''    session_id, mapping = _mapping(logged_in_client_a)\n    for column in mapping["columns"]:\n        review = logged_in_client_a.post(f"/api/imports/{session_id}/mapping", json={\n            "decisions": [{"column_index": column["column_index"], "target": column["final_target"]}]\n        })\n        assert review.status_code == 200, review.get_json()\n    approver = _second_user(logged_in_client_a)\n    approved = approver.post(f"/api/imports/{session_id}/mapping/approve")\n'''
          if old not in s:
              raise SystemExit('mapping security pattern not found')
          p.write_text(s.replace(old, new, 1))

          p = Path('tests/test_orders.py')
          s = p.read_text()
          old = '''def test_reject_stores_reason_and_cancels(logged_in_client_a, make_order):\n    resp, _, _ = make_order(logged_in_client_a)\n    order_id = resp.get_json()["order"]["id"]\n    logged_in_client_a.post(f"/api/orders/{order_id}/submit")\n    rejected = logged_in_client_a.post(f"/api/orders/{order_id}/reject", json={"reason": "price too high"})\n    assert rejected.status_code == 409\n    order = rejected.get_json()["order"]\n    assert order["status"] == "cancelled"\n    assert "price too high" in order["notes"]\n'''
          new = '''def test_reject_stores_reason_and_cancels(logged_in_client_a, client_b, make_order, db):\n    resp, _, _ = make_order(logged_in_client_a)\n    order_id = resp.get_json()["order"]["id"]\n    logged_in_client_a.post(f"/api/orders/{order_id}/submit")\n\n    from app.models.user import User, ROLE_MANAGER\n    tenant_id = logged_in_client_a.get("/api/auth/me").get_json()["user"]["tenant_id"]\n    manager = User(tenant_id=tenant_id, email="reject-manager@acme.test", full_name="Reject Manager", role=ROLE_MANAGER, active=True)\n    manager.set_password("Passw0rd1")\n    db.session.add(manager)\n    db.session.commit()\n    login = client_b.post("/api/auth/login", json={"email": "reject-manager@acme.test", "password": "Passw0rd1"})\n    assert login.status_code == 200\n\n    rejected = client_b.post(f"/api/orders/{order_id}/reject", json={"reason": "price too high"})\n    assert rejected.status_code == 200, rejected.get_json()\n    order = rejected.get_json()["order"]\n    assert order["status"] == "cancelled"\n    assert "price too high" in order["notes"]\n'''
          if old not in s:
              raise SystemExit('order rejection pattern not found')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Verify backend tests
        env:
          FLASK_ENV: testing
          TESTING: "true"
          SECRET_KEY: ci-secret-key
          DATABASE_URL: "sqlite:///:memory:"
          CORS_ORIGINS: "http://localhost:3000"
        run: |
          python -m pip install -r requirements.txt
          pytest -q
      - name: Commit and trigger CI for patched head
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests
          if git diff --cached --quiet; then
            echo "No repair changes needed"
            exit 0
          fi
          git commit -m "test: align import and order helpers with approval rules"
          git push origin HEAD:feature/price-intelligence-core
          gh workflow run ci.yml --ref feature/price-intelligence-core
