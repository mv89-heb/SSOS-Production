name: SSOS CI

on:
  push:
    branches:
      - main
      - 'agent/**'
      - 'feature/**'
  pull_request:
    branches:
      - main
      - 'feature/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-22.04
    env:
      FLASK_ENV: testing
      TESTING: "true"
      SECRET_KEY: ci-secret-key
      DATABASE_URL: "sqlite:///:memory:"
      CORS_ORIGINS: "http://localhost:3000"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install backend dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile Python
        run: python -m compileall -q app tests
      - name: Run backend tests
        run: pytest -q

  frontend:
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.22.2'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
      - name: Type-check frontend
        run: npx tsc --noEmit
      - name: Build frontend
        run: npm run build

  postgres-migrations:
    runs-on: ubuntu-22.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ssos_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d ssos_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      FLASK_ENV: development
      SECRET_KEY: ci-secret-key
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ssos_test?sslmode=disable
      DATABASE_SSLMODE: disable
      CORS_ORIGINS: http://localhost:3000
      RATELIMIT_STORAGE_URI: memory://
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install backend dependencies
        run: python -m pip install -r requirements.txt
      - name: Upgrade all PostgreSQL migration heads
        run: flask --app 'app:create_app' db upgrade heads
