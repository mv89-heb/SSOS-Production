name: SSOS Reminder Worker

# GitHub Actions is the production scheduler for reminders.
# It runs every 5 minutes; the worker can wait inside a 5-minute execution
# window so reminders are delivered at their configured time instead of early.
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reminder-worker:
    name: Process scheduled reminders
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    env:
      FLASK_ENV: production
      FLASK_APP: wsgi.py
      PYTHONPATH: .
      SECRET_KEY: ${{ secrets.SSOS_SECRET_KEY }}
      DATABASE_URL: ${{ secrets.SSOS_DATABASE_URL }}
      RATELIMIT_STORAGE_URI: ${{ secrets.SSOS_RATELIMIT_STORAGE_URI }}
      CORS_ORIGINS: ${{ secrets.SSOS_CORS_ORIGINS }}
      FRONTEND_PUBLIC_URL: ${{ secrets.SSOS_FRONTEND_PUBLIC_URL }}
      WEB_PUSH_VAPID_PUBLIC_KEY: ${{ secrets.SSOS_WEB_PUSH_VAPID_PUBLIC_KEY }}
      WEB_PUSH_VAPID_PRIVATE_KEY: ${{ secrets.SSOS_WEB_PUSH_VAPID_PRIVATE_KEY }}
      WEB_PUSH_VAPID_CLAIMS_EMAIL: ${{ secrets.SSOS_WEB_PUSH_VAPID_CLAIMS_EMAIL }}
      REMINDER_EXECUTION_WINDOW_MINUTES: "5"
      SESSION_COOKIE_SECURE: "True"
      MAX_UPLOAD_SIZE: "5242880"
      WTF_CSRF_ENABLED: "True"
      PYTHON_VERSION: "3.11.9"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip

      - name: Install backend dependencies
        run: python -m pip install -r requirements.txt

      - name: Validate required secrets
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SECRET_KEY" || { echo 'Missing SSOS_SECRET_KEY repository secret.'; exit 1; }
          test -n "$DATABASE_URL" || { echo 'Missing SSOS_DATABASE_URL repository secret.'; exit 1; }
          test -n "$RATELIMIT_STORAGE_URI" || { echo 'Missing SSOS_RATELIMIT_STORAGE_URI repository secret.'; exit 1; }
          test -n "$CORS_ORIGINS" || { echo 'Missing SSOS_CORS_ORIGINS repository secret.'; exit 1; }
          test "$RATELIMIT_STORAGE_URI" != "memory://" || { echo 'SSOS_RATELIMIT_STORAGE_URI must point to shared production storage.'; exit 1; }

      - name: Process due order reminders
        run: python scripts/reminder_worker.py

      - name: Process weekly inventory count reminders
        run: python scripts/inventory_count_reminder.py
