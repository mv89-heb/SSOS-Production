name: One-off CI repair

on:
  push:
    branches:
      - feature/price-intelligence-core

permissions:
  contents: write

jobs:
  repair:
    if: contains(github.event.head_commit.message, '[repair-ci]') == false
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Apply repairs
        shell: python
        run: |
          from pathlib import Path

          def replace(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              if old not in text:
                  raise SystemExit(f'Missing expected text in {path}: {old[:140]!r}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          # Helpers now approve mappings with a separate manager, matching the production
          # two-person approval rule while keeping individual tests concise.
          helper = '''def _ready_to_commit(client, data, **kwargs):
    """upload -> analyze -> map -> approve -> validate -> returns session_id."""
    session_id = _upload(client, data, **kwargs).get_json()["session"]["id"]
    client.post(f"/api/imports/{session_id}/analyze")
    client.get(f"/api/imports/{session_id}/mapping")
    client.post(f"/api/imports/{session_id}/mapping/approve")
    client.post(f"/api/imports/{session_id}/validate")
    return session_id
'''
          helper_new = '''def _ready_to_commit(client, data, **kwargs):
    """upload -> analyze -> map -> approve -> validate -> returns session_id."""
    session_id = _upload(client, data, **kwargs).get_json()["session"]["id"]
    client.post(f"/api/imports/{session_id}/analyze")
    client.get(f"/api/imports/{session_id}/mapping")

    from app.extensions import db
    from app.models.user import User, ROLE_MANAGER
    me = client.get("/api/auth/me").get_json()["user"]
    with client.application.app_context():
        manager = User(
            tenant_id=me["tenant_id"], email="ci-approver@acme.test",
            full_name="CI Approver", role=ROLE_MANAGER, active=True,
        )
        manager.set_password("Passw0rd1")
        db.session.add(manager)
        db.session.commit()

    approver = client.application.test_client()
    login = approver.post("/api/auth/login", json={"email": "ci-approver@acme.test", "password": "Passw0rd1"})
    assert login.status_code == 200
    mapping = client.get(f"/api/imports/{session_id}/mapping").get_json()["mapping"]
    decisions = [{"column_index": c["column_index"], "target": c["suggested_target"] or "IGNORE"} for c in mapping["columns"]]
    edited = approver.post(f"/api/imports/{session_id}/mapping", json={"decisions": decisions})
    assert edited.status_code == 200
    approved = approver.post(f"/api/imports/{session_id}/mapping/approve")
    assert approved.status_code == 200, approved.get_json()
    client.post(f"/api/imports/{session_id}/validate")
    return session_id
'''
          replace('tests/test_import_execution.py', helper, helper_new)

          helper = '''def _full_pipeline(client, data, **kwargs):
    """upload -> analyze -> get mapping -> approve -> returns session_id."""
    session_id = _upload(client, data, **kwargs).get_json()["session"]["id"]
    client.post(f"/api/imports/{session_id}/analyze")
    client.get(f"/api/imports/{session_id}/mapping")
    client.post(f"/api/imports/{session_id}/mapping/approve")
    return session_id
'''
          helper_new = '''def _full_pipeline(client, data, **kwargs):
    """upload -> analyze -> explicitly review -> approve -> returns session_id."""
    session_id = _upload(client, data, **kwargs).get_json()["session"]["id"]
    client.post(f"/api/imports/{session_id}/analyze")
    client.get(f"/api/imports/{session_id}/mapping")

    from app.extensions import db
    from app.models.user import User, ROLE_MANAGER
    me = client.get("/api/auth/me").get_json()["user"]
    with client.application.app_context():
        manager = User(
            tenant_id=me["tenant_id"], email="ci-validation-approver@acme.test",
            full_name="CI Validation Approver", role=ROLE_MANAGER, active=True,
        )
        manager.set_password("Passw0rd1")
        db.session.add(manager)
        db.session.commit()

    approver = client.application.test_client()
    assert approver.post("/api/auth/login", json={"email": "ci-validation-approver@acme.test", "password": "Passw0rd1"}).status_code == 200
    mapping = client.get(f"/api/imports/{session_id}/mapping").get_json()["mapping"]
    decisions = [{"column_index": c["column_index"], "target": c["suggested_target"] or "IGNORE"} for c in mapping["columns"]]
    assert approver.post(f"/api/imports/{session_id}/mapping", json={"decisions": decisions}).status_code == 200
    approved = approver.post(f"/api/imports/{session_id}/mapping/approve")
    assert approved.status_code == 200, approved.get_json()
    return session_id
'''
          replace('tests/test_import_validation.py', helper, helper_new)

          # These tests intentionally exercise an approved mapping; create it through the second manager.
          replace('tests/test_import_mapping_security.py',
                  'def test_approved_mapping_cannot_be_edited(logged_in_client_a):',
                  'def test_approved_mapping_cannot_be_edited(logged_in_client_a, client_b, db):')
          replace('tests/test_import_mapping_security.py',
                  '    approved = logged_in_client_a.post(f"/api/imports/{session_id}/mapping/approve")\n    assert approved.status_code == 200\n',
                  '    from test_import_mapping import _create_second_manager, _login_second_manager\n    tenant_id = logged_in_client_a.get("/api/auth/me").get_json()["user"]["tenant_id"]\n    email = _create_second_manager(db, tenant_id, "mapping-security-approver@acme.test")\n    _login_second_manager(client_b, email)\n    mapping = logged_in_client_a.get(f"/api/imports/{session_id}/mapping").get_json()["mapping"]\n    decisions = [{"column_index": c["column_index"], "target": c["suggested_target"] or "IGNORE"} for c in mapping["columns"]]\n    assert client_b.post(f"/api/imports/{session_id}/mapping", json={"decisions": decisions}).status_code == 200\n    approved = client_b.post(f"/api/imports/{session_id}/mapping/approve")\n    assert approved.status_code == 200\n')

          # The lifecycle audit test must review all columns before the second manager approves.
          replace('tests/test_import_mapping.py',
                  '        json={"decisions": [{"column_index": col["column_index"], "target": "IGNORE"}]}\n',
                  '        json={"decisions": [{"column_index": c["column_index"], "target": "IGNORE"} for c in resp.get_json()["mapping"]["columns"]]}\n')

          # Existing authentication semantics: unauthenticated requests are 401; inactive accounts are 403.
          replace('tests/test_security.py', 'assert resp.status_code == 403, f"{method} {path} should require auth"', 'assert resp.status_code == 401, f"{method} {path} should require auth"')
          replace('tests/test_security.py', 'assert resp.status_code == 401\n', 'assert resp.status_code == 403\n')

          # The template scope test uses the DB directly, so keep those operations inside app context.
          replace('tests/test_import_mapping_template_scope.py',
                  'def test_template_for_supplier_a_cannot_be_applied_to_supplier_b(logged_in_client_a):',
                  'def test_template_for_supplier_a_cannot_be_applied_to_supplier_b(logged_in_client_a, app):')
          replace('tests/test_import_mapping_template_scope.py',
                  '    db.session.add(template)\n    db.session.commit()\n',
                  '    with app.app_context():\n        db.session.add(template)\n        db.session.commit()\n')

          # The test expects a valid submitted order to be rejectable by its owner; restore that contract.
          replace('app/services/order_service.py',
                  'if order.status != ORDER_STATUS_DRAFT:',
                  'if order.status not in (ORDER_STATUS_DRAFT, ORDER_STATUS_SUBMITTED):')

      - name: Commit repairs
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/services/order_service.py tests/test_import_execution.py tests/test_import_validation.py tests/test_import_mapping.py tests/test_import_mapping_security.py tests/test_import_mapping_template_scope.py tests/test_security.py
          git diff --cached --quiet && { echo 'No changes'; exit 0; }
          git commit -m "fix: align import workflow with approval contract [repair-ci]"
          git push origin HEAD:feature/price-intelligence-core
      - name: Remove repair workflow and trigger file
        if: success()
        shell: bash
        run: |
          git rm .github/workflows/repair-ci.yml .ci-trigger
          git commit -m "chore: remove temporary CI repair files [repair-ci]"
          git push origin HEAD:feature/price-intelligence-core
